# Render Blueprint: one free web service (Docker) + one free PostgreSQL database.
services:
  - type: web
    name: sada
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: Sada
      - key: APP_LOCALE
        value: ar
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: sada-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: sada-db
    plan: free
    databaseName: sada
